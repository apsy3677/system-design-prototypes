# Shared local infrastructure for all labs.
#
# Services are grouped into profiles so a lab starts only what it needs
# (the dev box has ~7 GB RAM):
#   core  : postgres, redis
#   mysql : mysql
#   chaos : toxiproxy
#   obs   : prometheus, grafana, jaeger
#
#   make up                       # core only
#   make up PROFILES="core chaos" # core + toxiproxy
#   make up PROFILES=all          # everything
#
# Data lives in anonymous volumes; `make down` removes them, so every
# lab starts from a clean database. Labs create their own schema.

name: sdp

services:
  postgres:
    image: postgres:17-alpine
    profiles: [core]
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    command: ["postgres", "-c", "max_connections=200"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    profiles: [core]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    profiles: [mysql]
    environment:
      MYSQL_ROOT_PASSWORD: lab
      MYSQL_DATABASE: lab
      MYSQL_USER: lab
      MYSQL_PASSWORD: lab
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulab", "-plab"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Proxies are created at runtime by tests through the API on :8474.
  # Listen ports 20000-20019 are published so host-side tests can go
  # through a proxy to e.g. postgres:5432 inside the compose network.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: [chaos]
    ports:
      - "8474:8474"
      - "20000-20019:20000-20019"

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [obs]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [obs]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]

  # Jaeger v2 all-in-one: UI on :16686, OTLP gRPC :4317, OTLP HTTP :4318.
  jaeger:
    image: jaegertracing/jaeger:2.9.0
    profiles: [obs]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
